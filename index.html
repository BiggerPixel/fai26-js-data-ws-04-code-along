<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kassa | Vardagsteknik</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-stone-100 text-stone-950">
    <header class="border-b border-stone-200 bg-white">
      <div class="mx-auto max-w-5xl px-5 py-5">
        <p class="text-sm font-semibold tracking-[0.2em] text-emerald-700">VARDAGSTEKNIK</p>
        <p class="text-2xl font-bold">Kassa</p>
      </div>
    </header>

    <main class="mx-auto grid max-w-5xl gap-6 px-5 py-8 lg:grid-cols-[1fr_320px]">
      <section>
        <h1 class="text-3xl font-bold">Varukorg</h1>
        <div id="cart-items" class="mt-4 space-y-3">
          <!-- Ett exempelkort. Vi flyttar det till script.js. -->
          <article class="flex items-center gap-4 rounded-2xl bg-white p-4 shadow-sm">
            <img class="h-20 w-20 rounded-xl object-cover" src="https://images.unsplash.com/photo-1545127398-14699f92334b?w=600&auto=format&fit=crop&q=60" alt="Trådlösa hörlurar" />
            <div class="flex-1">
              <p class="text-sm font-medium text-emerald-700">North Sound</p>
              <h2 class="text-lg font-bold">Trådlösa hörlurar</h2>
              <p class="text-sm text-stone-500">2 st à 299 kr</p>
            </div>
            <p class="text-xl font-bold">598 kr</p>
          </article>
        </div>
      </section>

      <aside class="h-fit rounded-3xl bg-stone-950 p-6 text-white">
        <p class="text-sm font-semibold uppercase tracking-widest text-emerald-300">Ordersammanfattning</p>
        <div class="mt-6 flex items-end justify-between gap-4">
          <p class="text-stone-300">Att betala</p>
          <p id="order-total" class="text-3xl font-bold">0 kr</p>
        </div>
        <button class="mt-6 w-full rounded-2xl bg-emerald-600 px-5 py-4 font-bold hover:bg-emerald-500" type="button">
          Gå vidare till betalning
        </button>
      </aside>
    </main>
  </body>
</html>
